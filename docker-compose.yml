version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the project root directory inside the container at /app 
      # so that the Python module path "backend.main" works properly with auto-reload.
      - .:/app
    environment:
      - WORKDIR=/app
    working_dir: /app

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      # Create an anonymous volume for node_modules to avoid overwriting them 
      # with the local host's (potentially empty or incompatible) node_modules.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reload on some OSes/Docker setups
