version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the project root directory inside the container at /app 
      # so that the Python module path "backend.main" works properly with auto-reload.
      - .:/app
    environment:
      - WORKDIR=/app
      # Default: SQLite. Uncomment DATABASE_URL và chạy với profile postgres để dùng Postgres:
      # docker-compose --profile postgres up
      # - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/hrm
    working_dir: /app

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      # Create an anonymous volume for node_modules to avoid overwriting them 
      # with the local host's (potentially empty or incompatible) node_modules.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reload on some OSes/Docker setups

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=hrm
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
